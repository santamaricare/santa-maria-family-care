<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Maria — Ассистент</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#0d1a2e,#1a2d5a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;}
.wrap{width:100%;max-width:480px;height:95vh;max-height:800px;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
.hdr{background:linear-gradient(135deg,#5c3d1e,#c9a84c);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.av{width:46px;height:46px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;}
.hn{color:#fff;font-size:1.05rem;font-weight:800;}
.hs{font-size:0.68rem;color:rgba(255,255,255,0.72);display:flex;align-items:center;gap:4px;margin-top:2px;}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pu 1.5s infinite;}
@keyframes pu{0%,100%{opacity:1;}50%{opacity:0.3;}}
.screen{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.page{display:none;flex:1;flex-direction:column;overflow:hidden;}
.page.active{display:flex;}
.msgs{flex:1;overflow-y:auto;background:#f7f4ee;padding:14px;display:flex;flex-direction:column;gap:8px;}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:#c9a84c44;border-radius:3px;}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:0.87rem;line-height:1.65;animation:mi .22s ease;}
@keyframes mi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.bot{background:#fff;color:#2a1a08;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.07);align-self:flex-start;}
.usr{background:linear-gradient(135deg,#c9a84c,#a07830);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.qrs{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:100%;padding:2px 0;}
.qr{background:#fff;border:1.5px solid #c9a84c;color:#5c3d1e;padding:6px 13px;border-radius:20px;font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all .18s;}
.qr:hover{background:#c9a84c;color:#fff;}
.typing{align-self:flex-start;background:#fff;padding:10px 15px;border-radius:18px;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.07);display:none;}
.typing span{display:inline-block;width:7px;height:7px;background:#c9a84c;border-radius:50%;margin:0 2px;animation:bo 1.1s infinite;}
.typing span:nth-child(2){animation-delay:.18s;}
.typing span:nth-child(3){animation-delay:.36s;}
@keyframes bo{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-5px);}}
.summary{background:#fffbf0;border:1.5px solid #c9a84c;border-radius:14px;padding:13px 15px;font-size:0.82rem;line-height:1.95;color:#3a2a10;align-self:flex-start;max-width:94%;}
.summary b{color:#5c3d1e;font-size:0.9rem;display:block;margin-bottom:6px;}
.inp-area{background:#fff;padding:10px 12px;display:flex;gap:8px;align-items:flex-end;border-top:1px solid #f0e8d8;flex-shrink:0;}
.inp{flex:1;border:1.5px solid #e8d5b0;border-radius:12px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:0.87rem;color:#2a1a08;outline:none;resize:none;max-height:80px;transition:border-color .2s;}
.inp:focus{border-color:#c9a84c;}
.sbtn{background:linear-gradient(135deg,#c9a84c,#a07830);border:none;border-radius:12px;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sbtn svg{fill:#fff;width:17px;height:17px;}
.form-wrap{flex:1;overflow-y:auto;background:#f7f4ee;padding:16px;display:flex;flex-direction:column;gap:0;}
.form-wrap::-webkit-scrollbar{width:3px;}
.ftitle{font-size:1rem;font-weight:800;color:#5c3d1e;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid #c9a84c;}
.fee{background:#fffbf0;border:1.5px solid #c9a84c;border-radius:12px;padding:10px 13px;font-size:0.82rem;color:#5c3d1e;text-align:center;font-weight:700;margin-bottom:12px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:0.72rem;font-weight:800;color:#7a6a5a;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;border:1.5px solid #e8d5b0;border-radius:10px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:0.86rem;color:#2a1a08;outline:none;transition:border-color .2s;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#c9a84c;}
.fg textarea{resize:none;min-height:65px;}
.rg{display:flex;flex-wrap:wrap;gap:6px;}
.rg label{display:flex;align-items:center;gap:0;background:#fff;border:1.5px solid #e8d5b0;border-radius:20px;padding:6px 13px;font-size:0.78rem;font-weight:700;color:#5c3d1e;cursor:pointer;transition:all .18s;}
.rg label:hover{border-color:#c9a84c;}
.rg input[type=radio],.rg input[type=checkbox]{display:none;}
.rg label.sel{background:#c9a84c;border-color:#c9a84c;color:#fff;}
.fl-label{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px dashed #c9a84c;border-radius:10px;padding:10px 14px;cursor:pointer;color:#7a6a5a;font-size:0.82rem;font-weight:600;}
.sub{background:linear-gradient(135deg,#c9a84c,#a07830);color:#fff;border:none;border-radius:14px;padding:13px;font-family:'Nunito',sans-serif;font-size:0.92rem;font-weight:800;cursor:pointer;width:100%;margin-top:6px;}
.sub:hover{opacity:.88;}
.back{background:transparent;border:1.5px solid #c9a84c;color:#c9a84c;border-radius:14px;padding:9px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
.spage{flex:1;background:#f7f4ee;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.sicon{font-size:3.5rem;margin-bottom:16px;}
.stitle{font-size:1.2rem;font-weight:800;color:#5c3d1e;margin-bottom:10px;}
.stext{font-size:0.88rem;color:#7a6a5a;line-height:1.75;max-width:320px;}
</style>
</head>

function sel(el, grpId, radio) {

  el.classList.toggle('sel');
}

function getSelected(grpId) {
  var vals = [];
  document.querySelectorAll('#'+grpId+' label.sel').forEach(function(l){ vals.push(l.textContent.trim()); });
  return vals.join(', ');
}

// ── BOT MESSAGE ──
function botMsg(text, qr) {
  return new Promise(function(resolve) {
    var typing = document.getElementById('typing');
    var msgs = document.getElementById('msgs');
    typing.style.display = 'block';
    msgs.appendChild(typing);
    scrollBottom();
    setTimeout(function() {
      typing.style.display = 'none';
      var div = document.createElement('div');
      div.className = 'msg bot';
      div.textContent = text;
      msgs.appendChild(div);
      if(qr && qr.length) {
        var wrap = document.createElement('div');
        wrap.className = 'qrs';
        qr.forEach(function(label) {
          var btn = document.createElement('button');
          btn.className = 'qr';
          btn.textContent = label;
          btn.onclick = function(){ pickQR(label); };
          wrap.appendChild(btn);
        });
        msgs.appendChild(wrap);
      }
      scrollBottom();
      resolve();
    }, 750);
  });
}

function userMsg(text) {
  var msgs = document.getElementById('msgs');
  var div = document.createElement('div');
  div.className = 'msg usr';
  div.textContent = text;
  msgs.appendChild(div);
  document.querySelectorAll('.qrs').forEach(function(e){ e.remove(); });
  scrollBottom();
}

function showSummary() {
  var msgs = document.getElementById('msgs');
  var d = S.data;
  var flow = S.branch === 'client' ? CLIENT_FLOW : WORKER_FLOW;
  var lines = '';
  flow.forEach(function(f){
    if(d[f.key]) lines += '<br>• <b>' + f.key.charAt(0).toUpperCase()+f.key.slice(1) + ':</b> ' + d[f.key];
  });
  var div = document.createElement('div');
  div.className = 'summary';
  div.innerHTML = (S.branch==='client' ? '<b>📋 Заявка клиента</b>' : '<b>👤 Анкета сотрудника</b>') + lines;
  msgs.appendChild(div);
  scrollBottom();
}

// ── FLOW LOGIC ──
function getFlow() {
  return S.branch === 'client' ? CLIENT_FLOW : WORKER_FLOW;
}

function nextStep() {
  var flow = getFlow();
  S.step++;
  if(S.step < flow.length) {
    var f = flow[S.step];
    botMsg(f.q, f.qr || null);
  } else {
    // Done — show summary + closing
    showSummary();
    inputLocked = true;
    setTimeout(function(){
      var closing = S.branch === 'client'
        ? 'Спасибо! Для точного подбора специалиста заполните короткую онлайн-анкету.\n\nСтоимость услуги — 20 лари.'
        : 'Отлично! Чтобы добавить вас в базу специалистов, заполните анкету с фото.\n\nРегистрация — 20 лари.';
      botMsg(closing, S.branch === 'client' ? ['📋 Заполнить анкету'] : ['👤 Заполнить анкету']).then(function(){
        inputLocked = false;
      });
    }, 400);
  }
}

function pickQR(label) {
  if(inputLocked) return;
  if(label === '📋 Заполнить анкету') { userMsg(label); showPage('pgClient'); return; }
  if(label === '👤 Заполнить анкету') { userMsg(label); showPage('pgWorker'); return; }
  userMsg(label);
  var flow = getFlow();
  if(S.step >= 0 && S.step < flow.length) {
    S.data[flow[S.step].key] = label;
  }
  nextStep();
}

// ── SEND ──
function send() {
  if(inputLocked) return;
  var inp = document.getElementById('inp');
  var text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  userMsg(text);

  if(S.step === -1) {
    // waiting for client/worker choice
    var lower = text.toLowerCase();
    if(lower.indexOf('услуг') > -1 || lower.indexOf('клиент') > -1 || lower.indexOf('ищу') > -1 || lower.indexOf('нужн') > -1) {
      S.branch = 'client'; S.step = -1; nextStep();
    } else if(lower.indexOf('работ') > -1 || lower.indexOf('сотруд') > -1 || lower.indexOf('устроит') > -1) {
      S.branch = 'worker'; S.step = -1; nextStep();
    } else {
      botMsg('Пожалуйста, уточните — вы ищете услугу или работу?', ['Ищу услугу', 'Ищу работу']);
    }
    return;
  }

  var flow = getFlow();
  if(S.step >= 0 && S.step < flow.length) {
    S.data[flow[S.step].key] = text;
  }
  nextStep();
}

function handleKey(e) {
  if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

// ── FORM SUBMIT ──
function submitForm(type) {
  showPage('pgSuccess');
  if(type === 'client') {
    document.getElementById('sTitle').textContent = '✅ Заявка принята!';
    document.getElementById('sText').textContent = 'Спасибо! Наш менеджер свяжется с вами по WhatsApp в течение 1 часа. Стоимость подбора — 20 лари.';
  } else {
    document.getElementById('sTitle').textContent = '✅ Анкета отправлена!';
    document.getElementById('sText').textContent = 'Спасибо! Ваши данные добавлены в базу специалистов. Мы свяжемся с вами при наличии подходящего заказа.';
  }
}

// ── START ──
window.onload = function() {
  botMsg('Здравствуйте! Я ассистент Santa Maria Family Care.', null).then(function(){
    return botMsg('Вы ищете услугу или работу?', ['Ищу услугу', 'Ищу работу']);
  });
};
